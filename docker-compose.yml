services:
  db:
    image: postgres:16
    container_name: shop_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: shopdb
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - shop_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  catalog-api:
    build: 
      context: ./catalog-api
    container_name: catalog_api
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=shopdb;Username=postgres;Password=1234
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - shop_net

  users-api:
    build: 
      context: ./users-api
    container_name: users_api
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=shopdb;Username=postgres;Password=1234
    ports:
      - "8083:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - shop_net

  orders-api:
    build: 
      context: ./orders-api
    container_name: orders_api
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=shopdb;Username=postgres;Password=1234
      - CatalogApiUrl=http://catalog-api:8080
    ports:
      - "8082:8080"
    depends_on:
      db:
        condition: service_healthy
      catalog-api:
        condition: service_started
    networks:
      - shop_net

volumes:
  db_data:

networks:
  shop_net:
    driver: bridge